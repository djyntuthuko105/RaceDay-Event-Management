name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build API and MVC, run all tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check preserved planning documents
        run: test -f docs/erd.png && test -f docs/api_endpoint_plan.md && test -f docs/RaceDayDatabase.sql
      - name: Restore solution
        run: dotnet restore RaceDay-Event-Management.sln
      - name: Build Release
        run: dotnet build RaceDay-Event-Management.sln -c Release --no-restore
      - name: Test API and MVC workflows
        run: dotnet test RaceDay-Event-Management.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  docker:
    name: Docker end-to-end (${{ matrix.database }})
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [SQLite, SqlServer]
    env:
      COMPOSE_FILE: ${{ matrix.database == 'SqlServer' && 'compose.yml:compose.sqlserver.yml' || 'compose.yml' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Generate disposable SQL Server credentials
        if: matrix.database == 'SqlServer'
        shell: bash
        run: |
          password="Ci9!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "SQL_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start both application targets and local Blob emulator
        run: docker compose up --build -d
      - name: Verify actual MVC to API to Blob round-trip
        run: dotnet run --project RaceDay-Event-Management.SmokeChecks -c Release
      - name: Verify fresh SQL migrations, demo seed and original planning script
        if: matrix.database == 'SqlServer'
        shell: bash
        run: |
          # Use a separate database because the preserved Part 1 script recreates its target.
          sed 's/RaceDayDB/RaceDayPlanningCI/g' docs/RaceDayDatabase.sql | docker compose exec -T sqlserver bash -c 'export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"; exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b'
          docker compose exec -T sqlserver bash -c 'export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"; exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b' < scripts/verify-sqlserver.sql
      - name: Show container state and logs
        if: always()
        run: docker compose ps && docker compose logs --no-color
      - name: Clean up this CI runner's demo stack
        if: always()
        run: docker compose down --volumes
