# Required SQL Server database stack; the default Compose file is a portable demo. Set a strong SQL_PASSWORD in your shell first.
services:
  api:
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__RaceDayDb: Server=sqlserver;Database=RaceDayDB;User Id=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD};TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q 'SELECT 1' -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  sql-data:
